keychain_secrets:
  - service: "JIRA_API_TOKEN"
    prompt: "Jira API Token"
    description: "Atlassian API token for loan.cleris@vertuoza.com (vertuoza.atlassian.net)"
  - service: "ANTHROPIC_API_KEY"
    prompt: "Anthropic API Key"
    description: "Anthropic API key for omp (pay-per-token, bypasses the Claude subscription OAuth login)"
  - service: "SOPS_AGE_KEY"
    prompt: "SOPS Age Key"
    description: "Age private key for sops (decrypts casadana's .env.encrypted file)"
  - service: "CLIPROXY_API_KEY"
    prompt: "CLIProxyAPI client key"
    description: "Key clients send to CLIProxyAPI (access.api-keys in .config/cli-proxy-api/config.yaml)"
  - service: "CLIPROXY_MANAGEMENT_KEY"
    prompt: "CLIProxyAPI management key"
    description: "CLIProxyAPI management API key (management.secret-key, used by the T3 Code usage view)"
  # Add more secrets below as needed:
  # - service: "GITHUB_TOKEN"
  #   prompt: "GitHub Personal Access Token"
  #   description: "GitHub token for private API access"
