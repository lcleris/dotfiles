config-version: 8
server:
  host: "127.0.0.1" # keep: tailscale serve fronts it
  port: 8317
  trusted-proxies: ["127.0.0.1", "::1"]
  server-id: a4582ed7-e485-4c3c-b73e-960b2feaea5d
management:
  allow-remote: false
  secret-key: "__CLIPROXY_MANAGEMENT_KEY__"
access:
  api-keys:
    - "__CLIPROXY_API_KEY__"
routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "1h"
  retry:
    request-retry: 3
    max-retry-interval: 30
upstream:
  claude:
    header-defaults:
      # T3 Code is real Claude Code: forward its own version headers instead of the
      # built-in 2.1.280 baseline, which newer models (fable 5.2 needs >= 2.1.290) reject.
      native-entrypoints: ["t3-code"]
oauth:
  auth-dir: "~/.cli-proxy-api"
