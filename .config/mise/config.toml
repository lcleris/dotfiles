# Commandes utiles :
#   mise install          → installe tous les outils
#   mise ls               → liste les outils installés
#   mise use node@lts     → changer une version
#   mise x -- node --version → exécuter avec les outils activés

[tools]
bun = "latest"
pnpm = "latest"
node = "latest"
go = "latest"
java = "zulu-17.68.17.0"

[settings]
auto_install = true
experimental = true

# Variables d'env gérées par mise (remplace les exports manuels)
[env]

# Ce fichier est le config global de mise (~/.config/mise/config.toml), donc son
# cwd par défaut est $HOME et non ce repo : on force le dir des tasks ici.
[task_config]
dir = "~/dotfiles"

[tasks.install]
description = "Installe une machine neuve de bout en bout (scripts/bootstrap.sh)"
run = "bash ./scripts/bootstrap.sh"

[tasks.stow]
description = "Réapplique les symlinks Stow, CLIProxyAPI compris"
run = "bash ./scripts/bootstrap.sh link cliproxyapi"

[tasks.brew]
description = "Installe ce qui manque du Brewfile"
run = "bash ./scripts/bootstrap.sh packages"

[tasks.check]
description = "Liste les paquets du Brewfile qui ne sont pas installés"
run = "brew bundle check --verbose --no-upgrade --file=Brewfile"
